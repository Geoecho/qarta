<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- iOS Safari Theme Workaround: color-scheme must be set BEFORE theme-color -->
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#050505" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <title>Qarta</title>

  <!-- Critical: Apply background IMMEDIATELY to prevent flash and stabilize Safari -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('qarta_theme');
        const isDark = (saved === null) ? true : JSON.parse(saved);
        const bg = isDark ? '#050505' : '#F5F5F7';
        const sbStyle = isDark ? 'black-translucent' : 'default';

        // 1. Set background on HTML immediately
        document.documentElement.style.setProperty('background-color', bg, 'important');
        document.documentElement.style.setProperty('background', bg, 'important');

        // 2. Add dark class
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // 3. Inject critical styles block
        document.write(`
          <style id="theme-bg-styles">
            html, body, #root { 
              background: ${bg} !important; 
              background-color: ${bg} !important;
              min-height: 100vh;
            }
          </style>
        `);

        // 4. Update Meta tags Safely
        window.addEventListener('scroll', () => { }, { passive: true }); // Safari wake-up

        document.addEventListener('DOMContentLoaded', () => {
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (themeMeta) themeMeta.setAttribute('content', bg);
          if (statusMeta) statusMeta.setAttribute('content', sbStyle);

          document.body.style.setProperty('background-color', bg, 'important');
          document.body.style.setProperty('background', bg, 'important');
        });
      } catch (e) {
        console.error('Theme init error', e);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
